name: Send Daily Birthday Push Notification

on:
  schedule:
    # Runs at 03:30 UTC (9:00 AM IST) and 14:30 UTC (8:00 PM IST) every day
    - cron: '30 3,14 * * *'
  workflow_dispatch: # Allows manual trigger anytime from GitHub tab for testing

jobs:
  send-notification:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Install Dependencies
        run: npm install firebase-admin @google-generative-ai/server

      - name: Run Send Notification Script
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: node send-notification.js
